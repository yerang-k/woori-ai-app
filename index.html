<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>우리 아이</title>
<style>
  :root{
    --bg:#faf6f1; --card:#fff; --line:#eee6dc; --text:#2b2a28; --sub:#8a8378;
    --accent:#f2884b; --accent-soft:#fdeee2; --danger:#e05a5a; --ok:#3aa76d;
    --shadow:0 2px 8px rgba(120,90,60,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;padding-bottom:40px}
  header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
    padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:5}
  header .baby{font-size:22px;background:var(--accent-soft);border-radius:50%;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center}
  header .name{font-size:18px;font-weight:700;flex:1}
  header .name:focus{outline:none;border-bottom:1px dashed var(--accent)}
  header button.icon{background:none;border:none;font-size:20px;cursor:pointer;color:var(--sub);padding:4px}
  main{max-width:640px;margin:0 auto;padding:16px}
  .add-bar{display:flex;gap:10px;margin-bottom:18px}
  .add-bar button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;
    padding:16px 8px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .add-bar button .em{font-size:26px}
  .add-bar button:active{transform:scale(.98)}
  .section{margin-bottom:22px}
  .section h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:700}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    margin-bottom:8px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
  .item .body{flex:1;min-width:0}
  .item .title{font-weight:600;font-size:15px}
  .item .meta{font-size:13px;color:var(--sub);margin-top:2px}
  .item.done .title{text-decoration:line-through;color:var(--sub)}
  .item .chk{width:22px;height:22px;border:2px solid var(--accent);border-radius:6px;flex:0 0 auto;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
  .item.done .chk{background:var(--ok);border-color:var(--ok)}
  .item .src{font-size:12px;color:var(--accent);cursor:pointer;margin-top:6px;display:inline-block}
  .item .raw{margin-top:6px;font-size:13px;color:var(--sub);white-space:pre-wrap;
    background:var(--bg);border-radius:8px;padding:8px;display:none}
  .item .raw.open{display:block}
  .item .raw-img{max-width:100%;border-radius:8px;display:block}
  .item .del{background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:2px 4px}
  .empty{color:var(--sub);text-align:center;padding:36px 10px;font-size:14px}
  .empty .em{font-size:34px;display:block;margin-bottom:8px}
  /* 일정 D-day 배지 / 지난 일정 접기 */
  .ev-head{display:flex;align-items:flex-start;gap:8px}
  .ev-head .title{flex:1;min-width:0}
  .badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
  .b-today{background:#ffe1d3;color:#d1451b}
  .b-soon{background:#fff0c9;color:#b57d0a}
  .b-far{background:#eef0f4;color:#6b7280}
  .b-past{background:#f0ece7;color:#a59b8f}
  .item.past{opacity:.5}
  .hl{color:#2f6fed;font-weight:700}
  .group-toggle{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;
    cursor:pointer;padding:8px 2px 2px}
  .past-wrap{display:none;margin-top:6px}
  .past-wrap.open{display:block}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;
    justify-content:center;z-index:20}
  .modal-bg.open{display:flex}
  .modal{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;
    padding:18px 16px 24px;max-height:90vh;overflow:auto}
  .modal h3{margin:2px 0 14px;font-size:17px}
  .modal textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:12px;
    padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .modal input[type=text],.modal input[type=date],.modal input[type=time],.modal input[type=password]{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;
    font-family:inherit;margin-bottom:8px}
  .modal label{font-size:13px;color:var(--sub);display:block;margin:10px 0 4px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;
    cursor:pointer;margin-top:14px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:var(--bg);color:var(--text)}
  .btn:disabled{opacity:.5}
  .preview-img{max-width:100%;border-radius:10px;margin-top:10px;display:none}
  .hint{font-size:13px;color:var(--sub);margin:6px 0 0}
  .edit-list{margin-top:4px}
  .edit-list .er{display:flex;gap:6px;margin-bottom:6px;align-items:center}
  .edit-list .er input{margin-bottom:0}
  .edit-list .er button{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer}
  .addline{background:none;border:1px dashed var(--line);border-radius:10px;padding:8px;width:100%;
    color:var(--accent);cursor:pointer;font-size:14px}
  .spinner{text-align:center;padding:20px;color:var(--sub)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;
    padding:10px 16px;border-radius:20px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <span class="baby">👦</span>
  <div class="name" id="childName" contenteditable="true" spellcheck="false">우리 아이</div>
  <button class="icon" id="btnFamily" title="가족 공유">👨‍👩‍👧</button>
  <button class="icon" id="btnKey" title="API 키 설정">🔑</button>
</header>

<main>
  <div class="add-bar">
    <button id="btnImage"><span class="em">📷</span>이미지 공지</button>
    <button id="btnText"><span class="em">📝</span>텍스트 공지</button>
  </div>
  <div id="board"></div>
</main>

<!-- 입력 모달 -->
<div class="modal-bg" id="inputModal">
  <div class="modal">
    <h3 id="inputTitle">어린이집 공지 추가</h3>
    <input type="file" id="imgFile" accept="image/*" style="display:none">
    <img class="preview-img" id="imgPreview">
    <textarea id="textInput" placeholder="어린이집 공지 내용을 붙여넣거나 입력하세요.&#10;예) 9월 12일 현장학습을 갑니다. 물통과 모자를 준비해주세요. 오전 8시 30분까지 등원해주세요."></textarea>
    <p class="hint" id="inputHint"></p>
    <div id="analyzing" class="spinner" style="display:none">🤖 AI가 정리하고 있어요…</div>
    <button class="btn primary" id="btnAnalyze">AI로 정리하기</button>
    <button class="btn ghost" id="btnCancelInput">취소</button>
  </div>
</div>

<!-- 편집 모달 -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>내용 수정</h3>
    <label>일정 (제목 · 날짜 · 시간)</label>
    <div class="edit-list" id="edEvents"></div>
    <button class="addline" data-add="events">+ 일정 추가</button>
    <label>해야 할 일</label>
    <div class="edit-list" id="edTasks"></div>

    <label>준비물</label>
    <div class="edit-list" id="edSupplies"></div>
    <button class="addline" data-add="supplies">+ 준비물 추가</button>
    <label>중요 알림</label>
    <div class="edit-list" id="edNotes"></div>
    <button class="addline" data-add="notes">+ 알림 추가</button>
    <button class="btn primary" id="btnSaveEdit">저장</button>
    <button class="btn ghost" id="btnCancelEdit">취소</button>
  </div>
</div>

<!-- API 키 모달 -->
<div class="modal-bg" id="keyModal">
  <div class="modal">
    <h3>Gemini API 키</h3>
    <p class="hint">구글 AI Studio(aistudio.google.com/apikey)에서 무료로 발급받은 키를 붙여넣으세요. 키는 이 기기에만 저장됩니다.</p>
    <input type="password" id="keyInput" placeholder="AI... 로 시작하는 키">
    <button class="btn primary" id="btnSaveKey">저장</button>
    <button class="btn ghost" id="btnCancelKey">취소</button>
  </div>
</div>

<!-- 가족 공유 모달 -->
<div class="modal-bg" id="familyModal">
  <div class="modal">
    <h3>👨‍👩‍👧 가족 공유</h3>
    <p class="hint">엄마·아빠가 같은 아이 정보를 함께 봐요. 아이 사진(원본)은 공유되지 않고, 정리된 일정·할 일·준비물·알림만 공유됩니다.</p>

    <label>나는 누구인가요? (등록자 표시용)</label>
    <div class="row" id="meRow">
      <button type="button" class="btn ghost me-opt" data-me="엄마">엄마</button>
      <button type="button" class="btn ghost me-opt" data-me="아빠">아빠</button>
    </div>

    <label>가족 연결 — 웹앱 주소</label>
    <input type="text" id="syncUrlInput" placeholder="https://script.google.com/.../exec">
    <label>가족 키 (초대 코드)</label>
    <input type="text" id="syncKeyInput" placeholder="가족끼리 정한 비밀 코드">
    <div id="syncStatus" class="hint" style="margin-top:8px"></div>

    <button class="btn primary" id="btnSaveFamily">연결하고 동기화</button>
    <button class="btn ghost" id="btnSyncNow">지금 동기화</button>
    <button class="btn ghost" id="btnInvite">아빠에게 초대코드 공유</button>
    <button class="btn ghost" id="btnCancelFamily">닫기</button>
    <p class="hint" style="margin-top:12px">아직 가족 시트가 없나요? 처음 한 번만 구글시트를 만들어 연결하면 됩니다 — 설정 방법은 대화로 안내해 드려요.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 저장/상태 ================= */
const LS = {
  KEY:'wooriai_key', NAME:'wooriai_childname', ENTRIES:'wooriai_entries', MODEL:'wooriai_model',
  DELETED:'wooriai_deleted', SYNCURL:'wooriai_syncurl', SYNCKEY:'wooriai_synckey', ME:'wooriai_me'
};
const state = {
  apiKey: localStorage.getItem(LS.KEY) || '',
  childName: localStorage.getItem(LS.NAME) || '우리 아이',
  model: localStorage.getItem(LS.MODEL) || 'gemini-2.5-flash',
  entries: JSON.parse(localStorage.getItem(LS.ENTRIES) || '[]'),
  deleted: JSON.parse(localStorage.getItem(LS.DELETED) || '{}'),  // 삭제 표시 {id:시각} — 가족 동기화 병합용
  syncUrl: localStorage.getItem(LS.SYNCURL) || '',
  syncKey: localStorage.getItem(LS.SYNCKEY) || '',
  me: localStorage.getItem(LS.ME) || '',   // 내 역할(엄마/아빠 등) — 등록자 표시용
};
// 저장 + (가족 연결돼 있으면) 동기화 예약
function saveEntries(){
  localStorage.setItem(LS.ENTRIES, JSON.stringify(state.entries));
  localStorage.setItem(LS.DELETED, JSON.stringify(state.deleted));
  scheduleSync();
}
function touch(en){ en.updatedAt=Date.now(); }
function removeEntry(id){
  state.entries=state.entries.filter(e=>e.id!==id);
  state.deleted[id]=Date.now();   // 삭제 표시(다른 기기에도 삭제 전파)
}

/* ================= 가족 동기화 (구글시트 + GAS) ================= */
let syncTimer=null, syncing=false;
function syncConfigured(){ return !!(state.syncUrl && state.syncKey); }
function scheduleSync(){
  if(!syncConfigured()) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(false), 2500);   // 변경 후 2.5초 뒤 자동 업로드
}
function setSyncStatus(t){ const el=document.getElementById('syncStatus'); if(el) el.textContent=t; }
// 동기화용으로 사진(용량 큼)은 빼고 보냄
function stripForSync(entries){
  return entries.map(en=>({...en, source:{...en.source, image: en.source.image?'__local__':null}}));
}
// 두 상태 병합: id별 updatedAt 최신 우선 + 삭제표시 반영 + 이 기기의 원본 사진 보존
function mergeStates(a, b){
  const deleted={...(a.deleted||{})};
  for(const id in (b.deleted||{})) deleted[id]=Math.max(deleted[id]||0, b.deleted[id]);
  const byId={}, localImg={};
  [...(a.entries||[]), ...(b.entries||[])].forEach(e=>{
    if(e.source && e.source.image && e.source.image!=='__local__') localImg[e.id]=e.source.image;
    const cur=byId[e.id];
    if(!cur || (e.updatedAt||0) > (cur.updatedAt||0)) byId[e.id]=e;
  });
  let entries=Object.values(byId).filter(e=>!(deleted[e.id] && deleted[e.id] >= (e.updatedAt||0)));
  entries=entries.map(e=>{
    const img=(e.source&&e.source.image);
    if(localImg[e.id] && (!img || img==='__local__')) return {...e, source:{...e.source, image:localImg[e.id]}};
    if(img==='__local__') return {...e, source:{...e.source, image:null}};
    return e;
  });
  entries.sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0));
  return {entries, deleted};
}
async function syncNow(manual){
  if(!syncConfigured() || syncing) return;
  syncing=true; setSyncStatus('동기화 중…');
  try{
    const payload={ key:state.syncKey, state:{ entries:stripForSync(state.entries), deleted:state.deleted } };
    const res=await fetch(state.syncUrl, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, // 단순요청(CORS preflight 회피)
      body: JSON.stringify(payload)
    });
    const data=await res.json();
    if(!data.ok) throw new Error(data.error==='key'?'가족 키가 일치하지 않아요.':'동기화 실패: '+(data.error||''));
    const merged=mergeStates({entries:state.entries, deleted:state.deleted}, data.state||{entries:[],deleted:{}});
    state.entries=merged.entries; state.deleted=merged.deleted;
    localStorage.setItem(LS.ENTRIES, JSON.stringify(state.entries));
    localStorage.setItem(LS.DELETED, JSON.stringify(state.deleted));
    render();
    setSyncStatus('동기화됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
    if(manual) toast('가족과 동기화했어요 ✨');
  }catch(err){
    setSyncStatus('동기화 실패 — 연결 정보를 확인해 주세요.');
    if(manual) toast(err.message);
  }finally{ syncing=false; }
}

/* ================= Gemini 호출 ================= */
const API_BASE='https://generativelanguage.googleapis.com/v1beta';
const MODEL_FALLBACK=['gemini-2.5-flash','gemini-flash-latest','gemini-2.0-flash'];

function buildPrompt(){
  const today=new Date().toISOString().slice(0,10);
  return `당신은 어린이집 공지·문자를 정리하는 도우미입니다. 오늘 날짜는 ${today}입니다.
아래 공지(텍스트 또는 이미지)에서 부모가 챙겨야 할 정보를 추출해 JSON으로만 답하세요.

[날짜 계산 규칙 — 매우 중요]
"오늘·내일·모레·이번 주·다음 주" 같은 상대 표현을 실제 날짜(YYYY-MM-DD)로 바꿀 때:
- 기본 기준은 오늘(${today}, 캡처한 날)입니다.
- 단, 이미지/문자에 '받은 날짜'나 타임스탬프(예: "8월 20일 목요일", "오전 11:35")가 보이면 그 날짜를 우선 기준으로 삼으세요. (예: 받은 날짜 8월 20일 + "내일 생일잔치" → 8월 21일)
- 연도가 안 적혀 있으면 오늘 날짜의 연도로 추정하세요. 정말 알 수 없으면 null.

[분류 규칙]
- 생일잔치·현장학습·행사·수업·모임·상담처럼 '언제 일어나는 일'은 반드시 events에 넣고, date를 위 규칙대로 계산해 반드시 채우세요("내일" 같은 상대 표현도 실제 날짜로). 이런 일을 notes에만 넣지 마세요.
- notes에는 날짜와 무관한 일반 안내만 넣으세요.
- tasks(해야 할 일)와 supplies(준비물) 문구에는 날짜/요일을 넣지 마세요. 날짜는 events에만 넣습니다. (예: "9월 12일까지 활동비 납부" ❌ → "활동비 납부" ⭕)

형식:
{
  "events": [{"title":"행사명","date":"YYYY-MM-DD 또는 null","time":"HH:MM 또는 null"}],
  "tasks": ["부모가 해야 할 일"],
  "supplies": ["아이가 챙겨갈 준비물"],
  "notes": ["기타 중요한 알림"]
}
해당 항목이 없으면 빈 배열. 설명 없이 JSON만 출력하세요.

예시 — 입력(받은 날짜 8월 20일 목요일): "내일은 박소민 친구의 생일잔치가 진행됩니다. 작은 선물로 함께 축하해 주세요."
출력: {"events":[{"title":"박소민 친구 생일잔치","date":"${today.slice(0,4)}-08-21","time":null}],"tasks":["작은 선물 준비"],"supplies":[],"notes":[]}`;
}

async function requestGemini(model, parts){
  const url=`${API_BASE}/models/${model}:generateContent?key=${state.apiKey}`;
  const res=await fetch(url,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts}],
      generationConfig:{responseMimeType:'application/json'}
    })
  });
  return res;
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// 붐빔/일시장애(재시도로 풀림) vs 모델없음(다른 모델로) vs 그 외 판별
const isOverload=(s,m)=>s===503||s===429||s===500||/overload|high demand|try again later|temporarily|unavailable/i.test(m);
const isModelGone=(s,m)=>s===404||/not found|not supported|deprecated|no longer/i.test(m);
function friendlyErr(status,msg){
  if(/api key not valid|api_key_invalid|invalid.*key|permission|401|403/i.test(status+' '+msg))
    return 'API 키가 올바르지 않은 것 같아요. 오른쪽 위 🔑에서 키를 다시 확인해 주세요.';
  if(isOverload(status,msg))
    return 'AI 서버가 잠시 붐비고 있어요. 30초쯤 뒤 다시 "AI로 정리하기"를 눌러 주세요.';
  return 'AI 정리에 실패했어요. 잠시 후 다시 시도해 주세요.\n(' + (msg||('오류 '+status)).slice(0,120) + ')';
}

async function analyze(parts){
  let lastStatus=0, lastMsg='';
  const models=[state.model,...MODEL_FALLBACK.filter(m=>m!==state.model)];
  for(const m of models){
    for(let attempt=0; attempt<3; attempt++){          // 붐빔이면 같은 모델 재시도
      let res;
      try{ res=await requestGemini(m,parts); }
      catch(e){ throw new Error('인터넷 연결이 불안정한 것 같아요. 연결을 확인하고 다시 시도해 주세요.'); }
      if(res.ok){
        const data=await res.json();
        const text=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
        if(m!==state.model){ state.model=m; localStorage.setItem(LS.MODEL,m); }
        return normalizeStructured(text);
      }
      const err=await res.json().catch(()=>({}));
      lastStatus=res.status; lastMsg=err?.error?.message||('HTTP '+res.status);
      if(isOverload(lastStatus,lastMsg)){
        if(attempt<2){ await sleep(1500*(attempt+1)); continue; } // 1.5s→3s 후 재시도
        break;                                                    // 계속 붐비면 다음 모델
      }
      if(isModelGone(lastStatus,lastMsg)) break;                  // 모델 교체
      throw new Error(friendlyErr(lastStatus,lastMsg));           // 키 오류 등 즉시 안내
    }
  }
  throw new Error(friendlyErr(lastStatus,lastMsg));
}

/* AI 응답(JSON 문자열)을 안전하게 정규화 — 코드펜스/누락/형태 차이 흡수 */
function normalizeStructured(text){
  let t=(text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  let o;
  try{ o=JSON.parse(t); }
  catch(e){
    const m=t.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('AI 응답을 이해하지 못했어요. 다시 시도해 주세요.');
    o=JSON.parse(m[0]);
  }
  const arr=v=>Array.isArray(v)?v:(v==null?[]:[v]);
  const str=v=>(typeof v==='string')?v:(v&&v.title)||(v&&v.name)||String(v??'');
  // 최상위 {title,date,time} 단일 이벤트 형태도 흡수
  let evSrc=o.events;
  if(evSrc==null && o.title) evSrc={title:o.title,date:o.date,time:o.time};
  return {
    events: arr(evSrc).map(e=>({
      title: str(e.title||e.name||e),
      date: e.date||null, time: e.time||null
    })).filter(e=>e.title),
    tasks: arr(o.tasks).map(str).filter(Boolean),
    supplies: arr(o.supplies).map(str).filter(Boolean),
    notes: arr(o.notes).map(str).filter(Boolean),
  };
}

/* ================= 렌더 ================= */
const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
// 문장 속 날짜/요일/시간을 파랗게 강조 (esc 처리된 문자열에 적용)
const DATE_RE=/(\d{1,2}\s?월\s?\d{1,2}\s?일(\s?\([월화수목금토일]\))?|[월화수목금토일]요일|(오전|오후)\s?\d{1,2}\s?시(\s?\d{1,2}\s?분)?|\d{1,2}:\d{2}|다음\s?주|이번\s?주|모레|내일|오늘)/g;
function hlDates(s){ return s.replace(DATE_RE,'<span class="hl">$1</span>'); }
// 문장에 자체 날짜가 들어있는지(있으면 위쪽 날짜 줄 생략해 중복 방지)
const HAS_DATE=/\d{1,2}\s?월\s?\d{1,2}\s?일|[월화수목금토일]요일|\d{1,2}:\d{2}|(오전|오후)\s?\d{1,2}\s?시|다음\s?주|이번\s?주|모레|내일|오늘/;

function render(){
  $('childName').textContent=state.childName;
  const board=$('board');
  if(state.entries.length===0){
    board.innerHTML=`<div class="empty"><span class="em">📭</span>아직 정리된 공지가 없어요.<br>위에서 어린이집 공지를 추가해 보세요.</div>`;
    return;
  }
  // 모든 공지를 4개 섹션으로 집계. 할 일·준비물은 공지의 일정 날짜를 물려받음
  const events=[], tasks=[], supplies=[], notes=[];
  state.entries.forEach(en=>{
    const d=entryDate(en);
    en.structured.events.forEach(e=>events.push({e,en,dd:dday(e.date)}));
    en.structured.tasks.forEach((v,i)=>tasks.push({v,en,i,date:HAS_DATE.test(v)?null:d}));
    en.structured.supplies.forEach(v=>supplies.push({v,en,date:HAS_DATE.test(v)?null:d}));
    en.structured.notes.forEach(v=>notes.push({v,en}));
  });

  // 일정: 다가옴 / 지남(접기)
  const upEv=events.filter(o=>!o.dd||o.dd.diff>=0).sort((a,b)=>(a.e.date||'9999').localeCompare(b.e.date||'9999'));
  const pastEv=events.filter(o=>o.dd&&o.dd.diff<0).sort((a,b)=>(b.e.date||'').localeCompare(a.e.date||''));
  // 할 일: 안 끝난 것 / 완료(체크)한 것(접기). 임박한 날짜 순
  const isDone=o=>!!(o.en.structured.doneTasks&&o.en.structured.doneTasks[o.i]);
  const openTasks=tasks.filter(o=>!isDone(o)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  const doneT=tasks.filter(isDone);

  let html='';
  const evRows=upEv.map(({e,en,dd})=>eventRow(e,en,dd));
  if(pastEv.length){ evRows.push(toggleBtn('evpast','지난 일정',pastEv.length)); evRows.push(wrap('evpast',pastEv.map(({e,en,dd})=>eventRow(e,en,dd)).join(''))); }
  html+=section('📅 일정', evRows);

  const taskRows=openTasks.map(o=>checkRow(o.en,o.i,o.v,o.date));
  if(doneT.length){ taskRows.push(toggleBtn('donet','완료한 일',doneT.length)); taskRows.push(wrap('donet',doneT.map(o=>checkRow(o.en,o.i,o.v,o.date)).join(''))); }
  html+=section('☑️ 해야 할 일', taskRows);

  html+=section('🎒 준비물', supplies.map(o=>itemRow(o.en, withDate(esc(o.v),o.date))));
  html+=section('🔔 중요 알림', notes.map(({v,en})=>itemRow(en,`<div class="title">${hlDates(esc(v))}</div>`)));
  board.innerHTML=html;
  bindBoard();
  bindToggles(board);
}
const ymd=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;};
// 공지의 대표 날짜(가장 이른 일정 날짜) — 할 일·준비물이 물려받음. 없으면 등록한 날
function entryDate(en){
  const ds=(en.structured.events||[]).map(e=>e.date).filter(d=>d&&/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  return ds[0] || (en.createdAt?ymd(en.createdAt):null);
}
// 제목 + (있으면)날짜 줄
function withDate(titleHtml, date){
  const pre=date?`<span class="hl">${fmtDate(date)}</span> `:'';
  return `<div class="title">${pre}${titleHtml}</div>`;
}
function toggleBtn(id,label,n){ return `<button class="group-toggle" data-toggle="${id}" data-label="${label}" data-n="${n}">${label} ${n}개 보기 ▾</button>`; }
function wrap(id,inner){ return `<div class="past-wrap" data-wrap="${id}">${inner}</div>`; }
function bindToggles(board){
  board.querySelectorAll('[data-toggle]').forEach(btn=>{
    const w=board.querySelector(`[data-wrap="${btn.dataset.toggle}"]`);
    btn.onclick=()=>{ const open=w.classList.toggle('open');
      btn.textContent=open?`${btn.dataset.label} 접기 ▴`:`${btn.dataset.label} ${btn.dataset.n}개 보기 ▾`; };
  });
}
/* 오늘 기준 D-day. 날짜 없으면 null */
function dday(dateStr){
  if(!dateStr||!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const diff=Math.round((new Date(dateStr+'T00:00:00')-t)/86400000);
  if(diff<0) return {label:'지남', cls:'past', diff};
  if(diff===0) return {label:'오늘', cls:'today', diff};
  if(diff===1) return {label:'내일', cls:'soon', diff};
  if(diff<=7) return {label:'D-'+diff, cls:'soon', diff};
  return {label:'D-'+diff, cls:'far', diff};
}
function eventRow(e,en,dd){
  const meta=[fmtDate(e.date),e.time].filter(Boolean).join(' · ');
  const badge=dd?`<span class="badge b-${dd.cls}">${dd.label}</span>`:'';
  const inner=`<div class="ev-head"><div class="title">${esc(e.title)}</div>${badge}</div>`+
    (meta?`<div class="meta">${esc(meta)}</div>`:'');
  return itemRow(en, inner, dd&&dd.cls==='past'?'past':'');
}
function section(title, rows){
  if(rows.length===0) return '';
  return `<div class="section"><h2>${title}</h2>${rows.join('')}</div>`;
}
// 원문 보기 내용: 이미지 있으면 사진, 텍스트 있으면 글, 둘 다면 둘 다
function rawHtml(en){
  let h='';
  if(en.source.image && en.source.image!=='__local__') h+=`<img class="raw-img" src="${en.source.image}" loading="lazy">`;
  else if(en.source.image==='__local__') h+=`<div class="meta">📷 사진은 등록한 기기에만 있어요</div>`;
  if(en.source.rawText) h+=`<div${en.source.image?' style="margin-top:6px"':''}>${esc(en.source.rawText)}</div>`;
  return h||'(원문 없음)';
}
function itemRow(en, inner, cls=''){
  return `<div class="item ${cls}" data-en="${en.id}">
    <div class="body">${inner}
      <span class="src" data-raw>원문 보기</span>
      <div class="raw">${rawHtml(en)}</div>
    </div>
    <button class="del" data-del title="삭제">✕</button>
  </div>`;
}
function checkRow(en,i,text,date){
  const done=en.structured.doneTasks&&en.structured.doneTasks[i];
  const pre=date?`<span class="hl">${fmtDate(date)}</span> `:'';
  return `<div class="item ${done?'done':''}" data-en="${en.id}" data-task="${i}">
    <div class="chk" data-chk>${done?'✓':''}</div>
    <div class="body"><div class="title">${pre}${hlDates(esc(text))}</div>
      <span class="src" data-raw>원문 보기</span>
      <div class="raw">${rawHtml(en)}</div>
    </div>
    <button class="del" data-del title="삭제">✕</button>
  </div>`;
}
function fmtDate(d){
  if(!d) return '';
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
  if(!m) return d;
  const wd=['일','월','화','수','목','금','토'][new Date(d).getDay()];
  return `${+m[2]}월 ${+m[3]}일 (${wd})`;
}

function bindBoard(){

// 사진을 캔버스로 축소(긴 변 1568px, JPEG) — 저장공간 절약 + 업로드 속도 ↑, 글자 판독은 유지
function loadResized(file, maxSide=1568, quality=0.72){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxSide/Math.max(img.width,img.height));
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(img.src);
      const dataUrl=c.toDataURL('image/jpeg',quality);
      resolve({dataUrl, base64:dataUrl.split(',')[1], mime:'image/jpeg'});
    };
    img.onerror=()=>reject(new Error('이미지 로드 실패'));
    img.src=URL.createObjectURL(file);
  });
}
$('imgFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    pendingImage=await loadResized(f);   // {dataUrl, base64, mime}
    $('imgPreview').src=pendingImage.dataUrl; $('imgPreview').style.display='block';
  }catch(err){ toast('이미지를 불러오지 못했어요. 다른 사진으로 시도해 주세요.'); }
});

async function doAnalyze(){
  if(!state.apiKey){ toast('먼저 🔑 API 키를 설정해 주세요.'); openModal('keyModal'); return; }
  const rawText=$('textInput').value.trim();
  if(!pendingImage && !rawText){ toast('내용을 입력하거나 사진을 선택해 주세요.'); return; }
  const parts=[{text:buildPrompt()}];
  if(rawText) parts.push({text:'\n공지 내용:\n'+rawText});
  if(pendingImage) parts.push({inline_data:{mime_type:pendingImage.mime, data:pendingImage.base64}});

  $('analyzing').style.display='block'; $('btnAnalyze').disabled=true;
  try{
    const structured=await analyze(parts);
    structured.doneTasks=[];
    state.entries.unshift({
      id:'e'+Date.now()+'_'+Math.random().toString(36).slice(2,7),  // 기기 간 충돌 없는 고유 id
      createdAt:new Date().toISOString(),
      updatedAt:Date.now(),
      createdBy: state.me || '나',  // 가족 공유: 등록자(엄마/아빠)
      source:{ type: pendingImage?'image':'text', rawText: rawText||'', image: pendingImage?pendingImage.dataUrl:null },
      structured                  // 원문(source)과 AI 정리(structured)를 분리 저장
    });
    saveEntries(); render(); closeModal('inputModal'); toast('정리했어요 ✨');
  }catch(err){
    toast(err.message);
  }finally{
    $('analyzing').style.display='none'; $('btnAnalyze').disabled=false;
  }
}

  bg.addEventListener('click',e=>{ if(e.target===bg) bg.classList.remove('open'); });
});

/* ================= 자체 점검 (?selftest) ================= */
function selftest(){
  const r=normalizeStructured('```json\n{"title":"현장학습","date":"2026-09-12","time":"08:30","tasks":[{"title":"물통 준비"},"모자 준비"],"notes":["08:30까지 등원"]}\n```');
  console.assert(r.events.length===1 && r.events[0].title==='현장학습', 'event 파싱 실패(최상위 단일 이벤트)', r);
  console.assert(r.tasks.length===2 && r.tasks[0]==='물통 준비', 'task(객체/문자 혼합) 파싱 실패', r);
  console.assert(r.supplies.length===0, 'supplies 기본값 실패', r);
  const r2=normalizeStructured('설명 어쩌고 {"events":{"title":"단일객체","date":null},"tasks":[]} 뒤에 잡음');
  console.assert(r2.events.length===1 && r2.events[0].title==='단일객체', '단일객체/잡음 흡수 실패', r2);
  console.assert(fmtDate('2026-09-12')==='9월 12일 (토)', 'fmtDate 실패:'+fmtDate('2026-09-12'));
  document.body.insertAdjacentHTML('afterbegin','<div style="background:#2fa36b;color:#fff;padding:8px;text-align:center">selftest 통과 (콘솔 확인)</div>');
}

render();
if(!state.apiKey) setTimeout(()=>openModal('keyModal'),400);
if(syncConfigured()) syncNow(false);   // 열 때 가족 변경분 가져오기
if(location.search.includes('selftest')) selftest();
</script>
